name: pawnshake
description: >-
  Pawnshake protocol: signed peer-to-peer chess games with one-byte moves,
  Ed25519 (ZIP-215) records, chains with fork detection and anchors.
version: 0.1.0
homepage: https://pawntown.github.io/pawnshake/
repository: https://github.com/PawnTown/pawnshake/tree/main/dart
issue_tracker: https://github.com/PawnTown/pawnshake/issues
topics:
  - chess
  - protocol
  - ed25519
  - cryptography
  - p2p

environment:
  sdk: ^3.6.0

dependencies:
  crypto: ^3.0.6

dev_dependencies:
  test: ^1.25.0
  coverage: ^1.11.0
  lints: ^5.0.0
